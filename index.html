<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>logooo</title>
    <meta name="description" content="Symmetric logo marks from circles, sparks and grids. One click to copy as SVG or PNG." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" id="favicon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="content">
      <header>
        <h1 class="title rise">
          logooo <span class="slash" aria-hidden="true">/</span>
          <a class="handle" href="https://x.com/newomp4" target="_blank" rel="noopener noreferrer">@newomp4<span class="handle-arrow" aria-hidden="true">↗</span></a>
        </h1>
        <p class="lede rise" style="--d: 0.05s">
          Symmetric marks from circles, sparks and grids. Press <kbd>space</kbd> for another.
        </p>
      </header>

      <section class="stage rise" style="--d: 0.1s" aria-label="Current mark as app icons">
        <div class="icon icon--light" data-tile></div>
        <div class="icon icon--dark" data-tile></div>
        <div class="icon icon--color" data-tile><div class="mesh" aria-hidden="true"></div></div>
      </section>

      <div class="bar rise" style="--d: 0.15s">
        <span class="info" id="info" aria-live="polite"></span>
        <span class="nav">
          <button class="step" id="older" type="button" aria-label="Previous mark">←</button>
          <button class="step" id="newer" type="button" aria-label="Next mark">→</button>
          <button class="new" id="new" type="button">New</button>
        </span>
      </div>

      <dl class="rows">
        <div class="row rise" style="--d: 0.2s">
          <dt>Style</dt>
          <dd class="chips" id="families"></dd>
        </div>
        <div class="row rise" style="--d: 0.25s">
          <dt>Export</dt>
          <dd class="chips">
            <button class="action" type="button" data-copy="svg">
              <span class="swap"><span aria-hidden="false">Copy SVG</span><span aria-hidden="true">Copied</span></span>
              <span class="copy-icon" aria-hidden="true"></span>
            </button>
            <button class="action" type="button" data-copy="png">
              <span class="swap"><span aria-hidden="false">Copy PNG</span><span aria-hidden="true">Copied</span></span>
              <span class="copy-icon" aria-hidden="true"></span>
            </button>
            <button class="action" type="button" data-save="svg">SVG <span class="down" aria-hidden="true">↓</span></button>
            <button class="action" type="button" data-save="png">PNG <span class="down" aria-hidden="true">↓</span></button>
          </dd>
        </div>
        <div class="row rise" style="--d: 0.3s">
          <dt>Ink</dt>
          <dd class="chips" id="inks"></dd>
        </div>
        <div class="row rise" style="--d: 0.35s">
          <dt>History</dt>
          <dd>
            <ul class="thumbs" id="history"></ul>
            <p class="history-meta"><span id="count"></span> <button class="clear" id="clear" type="button">Clear</button></p>
          </dd>
        </div>
      </dl>

      <footer class="hints rise" style="--d: 0.4s">
        <kbd>space</kbd> new <span>·</span> <kbd>←</kbd> <kbd>→</kbd> browse <span>·</span> <kbd>c</kbd> copy svg <span>·</span> <kbd>p</kbd> copy png <span>·</span> <kbd>s</kbd> save svg
      </footer>
      <p class="sr-only" id="status" aria-live="polite"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
